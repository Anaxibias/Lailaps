<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
        <title>Dashboard</title>
    </head>
    <body>
        <div class="navbar navbar-dark bg-dark py-3">
            <div class="container-fluid">
                <span class="navbar-brand mb-0 fs-3 ps-3">Job Clipper</span>
                {% if current_user.is_authenticated %}
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav mr-auto ps-3">
                        <li class="nav-item active">
                            <a class="nav-link" href="/profile">Profile</a>
                        </li>
                        <li class="nav-item active">
                            <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
                        </li>
                    </ul>
                </div>
                {% else %}
                <a class="btn btn-dark" href="{{ url_for('login') }}">Login/Register</a>
                {% endif %}
            </div>
        </div>
        <div class="container-fluid text-center" style="background-color: bisque;">
            <div class="row pb-1">
                <div class="col">
                    <a href="FIXME">Get the extension!</a>
                </div>
            </div>
        </div>
        {% block content %}
        {% endblock %}
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            document.addEventListener('click', function (event) {
                var isClickInsideNavbar = document.querySelector('.navbar').contains(event.target);
                var navbarCollapse = document.querySelector('#navbarNav');
                var isNavbarOpen = navbarCollapse.classList.contains('show');

                if (!isClickInsideNavbar && isNavbarOpen) {
                    var toggler = document.querySelector('.navbar-toggler');
                    toggler.click();
                }
            });
        </script>
    </body>
</html>
